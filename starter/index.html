<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accueil — Mon site de cours</title>
    <meta name="description" content="Kit de démarrage : accueil listant les cours définis dans js/data.js." />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />

    <!-- Thème + palette appliqués AVANT le rendu (bloquant) -->
    <script src="js/theme.js"></script>

    <link rel="stylesheet" href="css/fonts.css" />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>

  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="index.html" aria-label="Accueil">
          <svg class="brand__mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="26" height="26" rx="8" /><path d="M13 12 L9 16 L13 20" /><path d="M19 12 L23 16 L19 20" />
          </svg>
          <span>Mon site<span class="brand__dot" aria-hidden="true">.</span></span>
        </a>
        <button class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="primary-nav" aria-label="Ouvrir le menu de navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
        </button>
        <nav class="primary-nav" id="primary-nav" aria-label="Navigation principale">
          <a href="index.html">Accueil</a>
        </nav>
        <!-- main.js injecte ici les boutons thème / palette / langue -->
        <div class="header-actions">
          <button class="theme-toggle" data-theme-toggle aria-label="Activer le thème sombre">
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="contenu">
      <div class="page-head">
        <div class="container">
          <p class="kicker">Kit de démarrage</p>
          <h1>Mes cours</h1>
          <p class="hero__lead">
            Cette page liste les cours définis dans <code>js/data.js</code>. Duplique le dossier
            <code>pages/mon-cours/</code> et son entrée dans <code>data.js</code> pour en ajouter.
          </p>
        </div>
      </div>

      <section class="section--tight">
        <div class="container container--wide">
          <div class="course-grid" id="course-grid"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="site-footer__bottom">
          <span>© <span data-year>2026</span> Mon site de cours.</span>
        </div>
      </div>
    </footer>

    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <!-- Mini-liste des cours (exemple d'exploitation de SITE_DATA) -->
    <script defer>
      window.addEventListener("DOMContentLoaded", function () {
        var data = window.SITE_DATA;
        var grid = document.getElementById("course-grid");
        if (!data || !grid) return;
        grid.innerHTML = data.courses
          .map(function (c) {
            return (
              '<a class="course-card" href="pages/' + c.dir + '/cours.html">' +
              '<span class="course-card__glyph" style="--accent:' + c.accent + '">' + c.glyph + "</span>" +
              "<h2>" + c.title + "</h2>" +
              "<p>" + c.tagline + "</p>" +
              '<span class="course-card__meta">' + c.lessons + " leçons · " + c.hours + " h</span></a>"
            );
          })
          .join("");
      });
    </script>
  </body>
</html>
