<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Preuve — l'interpréteur tourne en file://</title>
</head>
<body>
<!--
  Cette page n'est pas destinée à l'apprenant : c'est la PREUVE que
  js/interpreteur.js s'exécute dans un navigateur, en file://, sans serveur,
  sans module ES et sans dépendance. `tools/verif-interpreteur.js --navigateur`
  l'ouvre dans Chrome sans fenêtre et compare son résultat à celui obtenu dans
  Node. On peut aussi l'ouvrir à la main : le résultat s'affiche dans la page.
-->
<pre id="sortie">exécution…</pre>
<script src="../../js/interpreteur.js"></script>
<script src="interpreteur-programmes.js"></script>
<script src="interpreteur-contre-exemples.js"></script>
<script>
(function () {
  "use strict";
  var res = [];
  var progs = (window.INTERPRETEUR_PROGRAMMES || []).concat(window.INTERPRETEUR_CONTRE_EXEMPLES || []);
  for (var i = 0; i < progs.length; i++) {
    var p = progs[i];
    var r;
    try {
      r = window.Interpreteur.executer(p.src, { maxTrace: 20000, maxPas: 500000 });
      res.push({ nom: p.nom, sortie: r.sortie, erreur: r.erreur ? r.erreur.nom : null, pas: r.pas, trace: r.trace.length });
    } catch (e) {
      res.push({ nom: p.nom, sortie: null, erreur: "PLANTAGE:" + (e && e.message), pas: 0, trace: 0 });
    }
  }
  document.getElementById("sortie").textContent = "RESULTAT" + JSON.stringify(res);
})();
</script>
</body>
</html>
