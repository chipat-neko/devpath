<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Version imprimable d'un cours — Syntaxe</title>
    <meta name="description" content="Assemble toutes les leçons d'un cours Syntaxe en un seul document, prêt à imprimer ou à enregistrer en PDF." />
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />

    <script src="../js/theme.js"></script>

    <link rel="stylesheet" href="../css/fonts.css" />

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>

  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="../index.html" aria-label="Syntaxe — accueil">
          <svg class="brand__mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="26" height="26" rx="8" /><path d="M13 12 L9 16 L13 20" /><path d="M19 12 L23 16 L19 20" />
          </svg>
          <span>Syntaxe<span class="brand__dot" aria-hidden="true">.</span></span>
        </a>
        <button class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="primary-nav" aria-label="Ouvrir le menu de navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
        </button>
        <nav class="primary-nav" id="primary-nav" aria-label="Navigation principale">
          <a href="../index.html">Accueil</a>
          <a href="catalogue.html">Catalogue</a>
          <a href="recherche.html">Recherche</a>
        </nav>
        <div class="header-actions">
          <button class="theme-toggle" data-theme-toggle aria-label="Activer le thème sombre">
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="contenu">
      <noscript>
        <p class="noscript-avis">
          <strong>JavaScript est désactivé.</strong> Ce site n'a pas de serveur : le catalogue, la
          progression, les QCM et les exercices sont construits dans ton navigateur. Sans JavaScript,
          cette page n'affiche que son texte fixe. Active JavaScript, puis recharge la page.
        </p>
      </noscript>
      <div class="container container--wide">
        <div class="print-actions" id="print-actions">
          <div>
            <p class="kicker">Version imprimable</p>
            <h1 class="print-doc__title" id="print-title">Cours</h1>
          </div>
          <button type="button" class="btn btn--primary" id="print-btn" hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" /></svg>
            Imprimer / Enregistrer en PDF
          </button>
        </div>

        <p class="print-status" id="print-status" role="status" aria-live="polite">Préparation…</p>

        <div class="print-doc" id="print-content"></div>
      </div>
    </main>

    <!-- Pied de page du gabarit standard : c'était la seule page du site sans autre issue que le
         logo. Masqué à l'impression par la règle .site-footer de @media print (pages.css). -->
    <footer class="site-footer">
      <div class="container">
        <div class="site-footer__bottom">
          <span>© <span data-year>2026</span> Syntaxe. Projet de démonstration.</span>
          <span><a href="../index.html">← Retour à l'accueil</a></span>
        </div>
      </div>
    </footer>

    <script src="../js/data.js" defer></script>
    <script src="../js/imprimer.js" defer></script>
    <script src="../js/main.js" defer></script>
  </body>
</html>
